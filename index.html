<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hànyǔ — китайский начинается здесь</title>
  <meta name="description" content="Введите слово на русском или иероглифами: перевод, пиньинь и порядок черт.">
  <!-- Политика безопасности: разрешаем только свои файлы и перечисленные CDN.
       GitHub Pages не даёт менять HTTP-заголовки, поэтому задаём её мета-тегом.
       frame-ancestors (запрет встраивания в iframe) через мета-тег не работает. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://api.mymemory.translated.net; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d9488'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='%23e6f2f5' font-family='serif'%3E%E6%B1%89%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Hànyǔ — на главную">
      <span class="brand-mark">汉</span>
      <span class="brand-text">Hànyǔ</span>
    </a>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Китайский начинается здесь</h1>

      <form class="search" id="searchForm" role="search" autocomplete="off">
        <label class="visually-hidden" for="query">Слово на русском, иероглифами или пиньинем</label>
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="query" type="search" name="q" placeholder="привет, 你好 или nǐ hǎo" spellcheck="false">
        <button type="submit" class="btn-primary">Найти</button>
      </form>

      <div class="chips" id="examples" aria-label="Примеры"></div>
      <div class="suggest" id="suggest" hidden></div>
      <p class="search-note">Слова вне словаря переводятся внешним сервисом. Не вводите личные данные.</p>
    </section>

    <section class="result" id="result" aria-live="polite" hidden></section>

    <section class="history" id="historyBox" hidden>
      <h2 class="section-title">Недавние</h2>
      <div class="chips" id="history"></div>
    </section>

    <div class="cta">
      <a class="btn-hero" href="course.html">
        <span class="star s1" aria-hidden="true">✦</span>
        <span class="star s2" aria-hidden="true">✦</span>
        <span class="star s3" aria-hidden="true">✦</span>
        <span class="star s4" aria-hidden="true">✦</span>
        <span class="star s5" aria-hidden="true">✦</span>
        <span class="btn-hero-text">Начать изучение</span>
      </a>
    </div>
  </main>

  <footer class="footer">
    Онлайн-перевод слов вне словаря: MyMemory · Анимация: Hanzi Writer<br>
    <a href="privacy.html">Политика конфиденциальности</a>
  </footer>

  <!-- integrity: браузер проверит, что файл с CDN не подменён -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js" integrity="sha384-xd6VpwMU5AxPFzG/nyhXrW70SSR2usiUNV8RrA0wlOjYlCrZyzZC6JiR/mT51pm2" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.5/dist/index.js" integrity="sha384-xVOc29fEvSd2kiehn/G68i0AUsGb67RS3xxFcicOrdV+aizdO11IQHvq0VEMprf/" crossorigin="anonymous"></script>
  <script src="js/dictionary.js?v=2"></script>
  <script src="js/strokes.js"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
